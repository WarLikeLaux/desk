<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сегодня — список дел</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0d'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23232328' stroke-width='2'/%3E%3Cpath d='M16 6 A10 10 0 0 1 26 16' fill='none' stroke='%239dba85' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%239dba85'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <aside class="timers" id="timersPanel" aria-label="Таймеры">
        <header class="timers-header">
          <span class="timers-label">Таймеры</span>
          <span class="timers-count" id="timersCount">0</span>
        </header>
        <div class="timers-list" id="timersList"></div>
        <button class="panel-add timers-add" id="addTimer" type="button">
          <span class="panel-add-glyph" aria-hidden="true">+</span>
          <span>Новый таймер</span>
        </button>
      </aside>

      <section class="todo">
        <header class="header">
          <div class="meta">
            <span class="date" id="date"></span>
            <span class="progress" aria-label="Прогресс">
              <span class="progress-done" id="progressDone">0</span>
              <span class="progress-sep">/</span>
              <span class="progress-total" id="progressTotal">0</span>
            </span>
          </div>
          <div class="header-heading">
            <div class="header-copy">
              <h1 class="title">Сегодня</h1>
              <p class="subtitle" id="subtitle">Список текущих задач</p>
            </div>
            <div
              class="task-plan"
              id="taskPlan"
              role="status"
              tabindex="0"
              data-tooltip="Оценка времени по оставшимся задачам"
              hidden
            >
              <span class="task-plan-prefix" id="taskPlanPrefix" aria-hidden="true"
                >Осталось задач на</span
              >
              <div class="task-plan-time">
                <span class="task-plan-value" id="taskPlanValue"></span>
              </div>
              <span class="task-plan-label" id="taskPlanLabel" hidden></span>
            </div>
          </div>
        </header>

        <form class="composer" id="composer" autocomplete="off" novalidate>
          <div class="composer-meta" id="composerMeta" hidden></div>
          <div class="composer-main">
            <span class="composer-glyph" aria-hidden="true">+</span>
            <input
              type="text"
              class="composer-input"
              id="taskInput"
              placeholder="Что нужно сделать?"
              autocomplete="off"
              spellcheck="false"
              aria-label="Название новой задачи"
            />
            <div class="composer-estimate-field" id="composerEstimatePanel" hidden>
              <input
                id="taskEstimate"
                type="text"
                placeholder="30 мин"
                aria-label="Планируемое время, например 30 мин или 1–2 ч"
              />
            </div>
            <button
              class="composer-tool"
              id="toggleTaskEstimate"
              type="button"
              aria-label="Планируемое время"
              aria-expanded="false"
              aria-controls="composerEstimatePanel"
              data-tooltip="Время"
            >
              <svg
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <circle cx="8" cy="8" r="5.5" />
                <path d="M8 4.5V8l2.5 1.5" />
              </svg>
            </button>
            <button
              class="composer-tool"
              id="toggleTaskLink"
              type="button"
              aria-label="Прикрепить ссылку"
              aria-expanded="false"
              aria-controls="composerLinkPanel"
              data-tooltip="Ссылка"
            >
              <svg
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path
                  d="m6 10 4-4M6.5 5.5l1-1a3 3 0 0 1 4 4l-1 1M9.5 10.5l-1 1a3 3 0 0 1-4-4l1-1"
                />
              </svg>
            </button>
            <button class="composer-submit" type="submit" aria-label="Добавить задачу">
              <kbd class="composer-hint">Enter</kbd>
            </button>
          </div>
          <div class="composer-panel composer-link-panel" id="composerLinkPanel" hidden>
            <input
              class="composer-link-url"
              id="taskLink"
              type="text"
              placeholder="Адрес ссылки"
              aria-label="Адрес ссылки"
            />
            <input
              class="composer-link-name"
              id="taskLinkName"
              type="text"
              placeholder="Название"
              aria-label="Название ссылки (необязательно)"
            />
            <button
              class="text-button composer-link-attach"
              id="attachTaskLink"
              type="button"
              aria-label="Прикрепить ссылку"
            >
              <span class="composer-link-attach-label">Прикрепить</span>
              <svg
                class="composer-link-attach-icon"
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m3 8 3 3 7-7" />
              </svg>
            </button>
            <button
              class="composer-tool composer-link-cancel"
              id="cancelTaskLink"
              type="button"
              aria-label="Отменить добавление ссылки"
            >
              <svg
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="m4 4 8 8M12 4l-8 8" />
              </svg>
            </button>
          </div>
        </form>

        <nav class="filters" id="filters" aria-label="Списки задач">
          <button class="filter is-active" data-filter="all" type="button" aria-pressed="true">
            Все <span class="filter-count" data-count="all">0</span>
          </button>
          <button class="filter" data-filter="active" type="button" aria-pressed="false">
            Активные <span class="filter-count" data-count="active">0</span>
          </button>
          <button class="filter" data-filter="completed" type="button" aria-pressed="false">
            Завершённые <span class="filter-count" data-count="completed">0</span>
          </button>
          <button
            class="filter filter-later"
            data-filter="later"
            type="button"
            aria-pressed="false"
          >
            На потом <span class="filter-count" data-count="later">0</span>
          </button>
        </nav>

        <ul class="tasks" id="taskList" role="list"></ul>

        <div class="empty" id="emptyState" hidden>
          <div class="empty-mark" aria-hidden="true">
            <svg
              viewBox="0 0 32 32"
              width="32"
              height="32"
              fill="none"
              stroke="currentColor"
              stroke-width="1.25"
            >
              <rect x="6" y="4" width="20" height="24" rx="2" />
              <path d="M11 11h10M11 16h10M11 21h6" />
            </svg>
          </div>
          <p class="empty-title" id="emptyTitle">Список пуст</p>
          <p class="empty-hint" id="emptyHint">Введите первую задачу и нажмите Enter</p>
        </div>

        <footer class="footer" id="footer">
          <span class="remaining" id="remaining">0 осталось</span>
          <div class="footer-right">
            <button
              class="copy"
              id="copyTasks"
              type="button"
              title="Скопировать задачи текущей вкладки"
            >
              Скопировать
            </button>
            <button class="clear" id="clearCompleted" type="button" hidden>
              <span class="clear-label">Очистить завершённые</span>
              <span class="clear-count" id="clearCount">0</span>
            </button>
          </div>
        </footer>
      </section>

      <aside class="right-panel notes" id="notesPanel" aria-label="Привычки и заметки">
        <details class="habits" id="habitsSection" open>
          <summary class="habits-heading">
            <svg
              class="habits-chevron"
              viewBox="0 0 16 16"
              width="14"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m6 4 4 4-4 4" />
            </svg>
            <span>Ежедневные привычки</span>
            <span
              class="habits-count"
              id="habitsCount"
              aria-live="polite"
              aria-label="Выполнено привычек сегодня"
              >0 / 0</span
            >
          </summary>
          <div class="habits-body">
            <ul class="habits-list" id="habitsList" aria-label="Привычки на сегодня"></ul>
            <form class="composer-main" id="habitComposer" autocomplete="off">
              <span class="composer-glyph" aria-hidden="true">+</span>
              <input
                id="habitInput"
                class="composer-input"
                type="text"
                placeholder="Добавить привычку"
                maxlength="200"
                spellcheck="false"
                aria-label="Название новой ежедневной привычки"
              />
              <button class="composer-submit" type="submit" aria-label="Добавить привычку">
                <kbd class="composer-hint">Enter</kbd>
              </button>
            </form>
          </div>
        </details>
        <header class="notes-header">
          <span class="notes-label">заметки</span>
          <span class="notes-count" id="notesCount">0</span>
        </header>
        <div class="notes-list" id="notesList"></div>
        <button class="panel-add notes-add" id="addNote" type="button">
          <span class="panel-add-glyph" aria-hidden="true">+</span>
          <span>Новая заметка</span>
        </button>
      </aside>
    </main>

    <dialog
      class="focus-overlay"
      id="focusOverlay"
      hidden
      aria-label="Таймер на весь экран"
    ></dialog>

    <dialog
      class="focus-overlay note-focus"
      id="noteFocusOverlay"
      hidden
      aria-label="Заметка на весь экран"
    ></dialog>

    <dialog class="task-editor" id="taskEditor" aria-labelledby="taskEditorTitle">
      <form id="taskEditorForm">
        <header class="editor-header">
          <h2 id="taskEditorTitle">Изменить задачу</h2>
          <button id="closeTaskEdit" class="editor-close" type="button" aria-label="Закрыть">
            <svg
              viewBox="0 0 16 16"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m4 4 8 8M12 4l-8 8" />
            </svg>
          </button>
        </header>
        <div class="editor-body">
          <textarea
            id="editTaskText"
            class="editor-name"
            rows="2"
            aria-label="Название задачи"
            placeholder="Название задачи"
            required
          ></textarea>
          <div class="editor-options">
            <label class="editor-field editor-estimate">
              Время
              <input id="editTaskEstimate" type="text" placeholder="30 мин или 1–2 ч" />
            </label>
            <div class="editor-field editor-bucket">
              <span>Раздел</span>
              <div class="editor-bucket-control">
                <span id="editTaskBucket" aria-live="polite">Сегодня</span>
                <button id="moveTaskBucket" class="text-button editor-move" type="button">
                  <span id="moveTaskBucketLabel">На потом</span>
                  <svg
                    viewBox="0 0 16 16"
                    width="14"
                    height="14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    aria-hidden="true"
                  >
                    <path d="M3 8h10m-4-4 4 4-4 4" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <section class="editor-links" aria-label="Ссылки задачи">
            <div class="editor-links-heading">
              <span>Ссылки</span>
              <button id="addTaskLink" class="text-button" type="button">
                <svg
                  viewBox="0 0 16 16"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  aria-hidden="true"
                >
                  <path d="M8 3v10M3 8h10" />
                </svg>
                Добавить
              </button>
            </div>
            <div id="editTaskLinks" class="editor-links-list"></div>
          </section>
        </div>
        <footer class="editor-footer">
          <button id="cancelTaskEdit" class="text-button" type="button">Отмена</button>
          <button class="primary-button" type="submit">Сохранить</button>
        </footer>
      </form>
    </dialog>

    <div class="toast" id="toast" hidden role="status" aria-live="polite">
      <span class="toast-text" id="toastText"></span>
      <button class="toast-action" id="toastAction" type="button">Отменить</button>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
